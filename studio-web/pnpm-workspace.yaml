# The federation DTS plugin pulls in adm-zip. Version 0.6.1 retains the
# decompression fix and blocks destination-symlink extraction
# (GHSA-xcpc-8h2w-3j85 and GHSA-vwc7-r8mq-g2x9).
overrides:
  'adm-zip@<0.6.1': '0.6.1'
  # Dependabot alert #91; patched in postcss 8.5.23.
  'postcss@<=8.5.22': '8.5.23'
  # Dependabot alerts #150-153, #156 and #157 (GHSA-w293-vg96-wgc3 and five
  # others); patched in undici 7.29.1, which also covers alerts #82-86.
  'undici@<7.29.1': '7.29.1'
  # GHSA-rgw5-rvv9-x895 and GHSA-q2hr-2g5m-vwhr, reached only through the
  # typedoc docs generator; patched in brace-expansion 5.0.12.
  'brace-expansion@<5.0.12': '5.0.12'
  # GHSA-253c-mchw-3w2r, reached only through the typedoc docs generator;
  # patched in markdown-it 14.3.1.
  'markdown-it@<14.3.1': '14.3.1'
  # GHSA-68fv-2mgg-jv7q (Dependabot alert #188), reached through postcss,
  # css-tree and magicast in the build and test tools; patched in
  # source-map-js 1.2.2.
  'source-map-js@<1.2.2': '1.2.2'
