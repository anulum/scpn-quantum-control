<!-- SCPN Quantum Control — Group and project map -->
<title id="title">SCPN Quantum Computing Systems group map</title>
<desc id="description">Permanent integrated workbench, two existing numerical packages, sixteen planned component destinations and eight supporting tools. Three tools have implementations under development; five are at design stage. Four wider ecosystem interfaces sit outside that count. Lines group responsibilities for navigation, not dependencies or extraction order. Current workbench metadata 1.2.0; planned architecture milestone 10.0.0 is not a release. Status snapshot 11 October 2026.</desc>
