# SCPN Quantum Control — Package initializer coverage

[tool.coverage.run]
branch = true
parallel = true
concurrency = ["multiprocessing", "thread"]
patch = ["subprocess"]
include = [
    "*/scpn_quantum_control/__init__.py",
    "*/scpn_quantum_control/**/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.\\s*$",
]
exclude_also = ["if TYPE_CHECKING:"]
