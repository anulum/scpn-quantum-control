# SCPN Quantum Control — Dependabot
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # Root pip proposals cannot refresh the governed hash locks and dependent
    # external-validation manifests together. Keep alerts enabled and route
    # version changes through the owner-controlled dependency census/batch.
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    ignore:
      - dependency-name: setuptools
      - dependency-name: "*"
  - package-ecosystem: pip
    directory: "/oscillatools"
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: cargo
    directory: "/scpn_quantum_engine"
    schedule:
      interval: weekly
      day: monday
