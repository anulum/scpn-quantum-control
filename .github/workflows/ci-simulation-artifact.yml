# SCPN Quantum Control — CI Simulation Artifact
name: CI / Simulation Artifact

on:
  workflow_call:

permissions:
  contents: read

jobs:
  nqs-ansatz-quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: {python-version: "3.12", cache: 'pip'}
      - run: python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
      - run: >-
          python -m mypy --strict --explicit-package-bases
          src/scpn_quantum_control/phase/nqs_ansatz.py
          tests/test_nqs_ansatz.py
          tools/nqs_ansatz_quality_gates.py
          tests/test_nqs_ansatz_quality_gate.py
      - run: >-
          python -m ruff check --isolated --preview --select D,D413,D417,D420
          --config 'lint.explicit-preview-rules = true'
          --config 'lint.pydocstyle.convention = "numpy"'
          src/scpn_quantum_control/phase/nqs_ansatz.py
          tests/test_nqs_ansatz.py
          tools/nqs_ansatz_quality_gates.py
          tests/test_nqs_ansatz_quality_gate.py
      - run: >-
          python -m coverage run --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-nqs-ansatz-quality.coverage --branch
          -m pytest -q tests/test_nqs_ansatz.py
      - run: >-
          python -m coverage report --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-nqs-ansatz-quality.coverage
          --precision=2 --show-missing --fail-under=100
          --include=*/phase/nqs_ansatz.py
