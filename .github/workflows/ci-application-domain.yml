# SCPN Quantum Control — CI Application Domain
name: CI / Application Domain

on:
  workflow_call:

permissions:
  contents: read

jobs:
  phase-qnode-product-quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: {python-version: "3.12", cache: 'pip'}
      - name: Install pinned CI and CPU-only PyTorch surfaces
        run: |
          python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
          python -m pip install --require-hashes -r requirements-ci-torch-cpu-py312-linux.txt
      - run: >-
          python -m mypy --strict --explicit-package-bases
          src/scpn_quantum_control/phase_qnode_product.py
          src/scpn_quantum_control/phase/torch_autograd_function.py
          tests/test_phase_qnode_product.py
          tests/test_phase_torch_autograd_function.py
          tools/phase_qnode_product_quality_gates.py
          tests/test_phase_qnode_product_quality_gate.py
      - run: >-
          python -m ruff check --isolated --preview --select D,D413,D417,D420
          --config 'lint.explicit-preview-rules = true'
          --config 'lint.pydocstyle.convention = "numpy"'
          src/scpn_quantum_control/phase_qnode_product.py
          src/scpn_quantum_control/phase/torch_autograd_function.py
          tests/test_phase_qnode_product.py
          tests/test_phase_torch_autograd_function.py
          tools/phase_qnode_product_quality_gates.py
          tests/test_phase_qnode_product_quality_gate.py
      - run: >-
          python -m coverage run --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-phase-qnode-product-quality.coverage --branch
          -m pytest -q tests/test_phase_qnode_product.py
          tests/test_phase_torch_autograd_function.py
      - run: >-
          python -m coverage report --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-phase-qnode-product-quality.coverage
          --precision=2 --show-missing --fail-under=100
          --include=*/phase_qnode_product.py,*/phase/torch_autograd_function.py
  rust-accel-import-resilience-quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
      - name: Type-check Rust accelerator import-resilience cohort
        run: >-
          python -m mypy --strict --explicit-package-bases
          src/scpn_quantum_control/_rust_accel.py
          scripts/verify_hardware_result_packs.py
          tests/test_rust_accel_import_resilience.py
          tools/rust_accel_import_resilience_quality_gates.py
          tests/test_rust_accel_import_resilience_quality_gate.py
      - name: Ruff preview NumPy docs for Rust accelerator import resilience
        run: >-
          python -m ruff check --isolated --preview --select D,D413,D417,D420
          --config 'lint.explicit-preview-rules = true'
          --config 'lint.pydocstyle.convention = "numpy"'
          src/scpn_quantum_control/_rust_accel.py
          scripts/verify_hardware_result_packs.py
          tests/test_rust_accel_import_resilience.py
          tools/rust_accel_import_resilience_quality_gates.py
          tests/test_rust_accel_import_resilience_quality_gate.py
      - name: Run Rust accelerator import-resilience focused coverage
        run: >-
          python -m coverage run --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-rust-accel-import-resilience-quality.coverage --branch
          -m pytest -q tests/test_rust_accel_import_resilience.py
      - name: Enforce Rust accelerator import-resilience exact coverage
        run: >-
          python -m coverage report --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-rust-accel-import-resilience-quality.coverage
          --precision=2 --show-missing --fail-under=100
          --include=*/scpn_quantum_control/_rust_accel.py
