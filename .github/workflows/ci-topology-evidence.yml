# SCPN Quantum Control — CI Topology Evidence
name: CI / Topology Evidence

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dla-topology-parity-quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
      - name: Type-check DLA topology parity quality cohort
        run: >-
          python -m mypy --strict --explicit-package-bases
          src/scpn_quantum_control/dla_topology_control/parity.py
          src/scpn_quantum_control/analysis/dla_parity_theorem.py
          src/scpn_quantum_control/dla_parity/__init__.py
          src/scpn_quantum_control/dla_parity/baselines.py
          src/scpn_quantum_control/dla_parity/dataset.py
          src/scpn_quantum_control/dla_parity/reproduce.py
          tests/test_dla_parity_theorem.py
          tests/test_dla_parity_init.py
          tests/test_dla_parity_baselines.py
          tests/test_dla_parity_dataset.py
          tests/test_dla_parity_reproduce.py
          tools/dla_topology_parity_quality_gates.py
          tests/test_dla_topology_parity_quality_gate.py
      - name: Ruff NumPy docstrings for DLA topology parity quality cohort
        run: >-
          python -m ruff check --isolated --preview --select D,D413,D417,D420
          --config 'lint.explicit-preview-rules = true'
          --config 'lint.pydocstyle.convention = "numpy"'
          src/scpn_quantum_control/dla_topology_control/parity.py
          src/scpn_quantum_control/analysis/dla_parity_theorem.py
          src/scpn_quantum_control/dla_parity/__init__.py
          src/scpn_quantum_control/dla_parity/baselines.py
          src/scpn_quantum_control/dla_parity/dataset.py
          src/scpn_quantum_control/dla_parity/reproduce.py
          tests/test_dla_topology_control_parity.py
          tests/test_dla_parity_theorem.py
          tests/test_dla_parity_init.py
          tests/test_dla_parity_baselines.py
          tests/test_dla_parity_dataset.py
          tests/test_dla_parity_reproduce.py
          tools/dla_topology_parity_quality_gates.py
          tests/test_dla_topology_parity_quality_gate.py
      - name: Run DLA topology parity focused coverage
        run: >-
          python -m coverage run
          --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-dla-topology-parity-quality.coverage
          --branch
          -m pytest -q
          tests/test_dla_topology_control_parity.py
          tests/test_dla_topology_control_objectives.py
          tests/test_dla_topology_control_optimizer.py
          tests/test_dla_parity_theorem.py
          tests/test_dla_parity_init.py
          tests/test_dla_parity_baselines.py
          tests/test_dla_parity_dataset.py
          tests/test_dla_parity_reproduce.py
      - name: Enforce DLA topology parity exact coverage
        run: >-
          python -m coverage report
          --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-dla-topology-parity-quality.coverage
          --precision=2
          --fail-under=100
          --include=*/dla_topology_control/parity.py,*/analysis/dla_parity_theorem.py,*/dla_parity/__init__.py,*/dla_parity/baselines.py,*/dla_parity/dataset.py,*/dla_parity/reproduce.py
