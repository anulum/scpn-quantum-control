# SCPN Quantum Control — CI Product Deployment
name: CI / Product Deployment

on:
  workflow_call:

permissions:
  contents: read

jobs:
  error-mitigation-product-quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
      - name: Type-check error-mitigation product quality cohort
        run: >-
          python -m mypy --strict --explicit-package-bases
          src/scpn_quantum_control/error_mitigation_product.py
          src/scpn_quantum_control/mitigation/compound_mitigation.py
          src/scpn_quantum_control/mitigation/cpdr.py
          src/scpn_quantum_control/mitigation/mitiq_integration.py
          src/scpn_quantum_control/mitigation/symmetry_decay.py
          tests/test_error_mitigation_product.py
          tests/test_compound_mitigation.py
          tests/test_cpdr.py
          tests/test_mitiq_integration.py
          tests/test_symmetry_decay.py
          tools/error_mitigation_product_quality_gates.py
          tests/test_error_mitigation_product_quality_gate.py
      - name: Ruff NumPy docstrings for error-mitigation product quality cohort
        run: >-
          python -m ruff check --isolated --select D,D413
          --config 'lint.pydocstyle.convention = "numpy"'
          src/scpn_quantum_control/error_mitigation_product.py
          src/scpn_quantum_control/mitigation/compound_mitigation.py
          src/scpn_quantum_control/mitigation/cpdr.py
          src/scpn_quantum_control/mitigation/mitiq_integration.py
          src/scpn_quantum_control/mitigation/symmetry_decay.py
          tests/test_error_mitigation_product.py
          tests/test_compound_mitigation.py
          tests/test_cpdr.py
          tests/test_mitiq_integration.py
          tests/test_symmetry_decay.py
          tools/error_mitigation_product_quality_gates.py
          tests/test_error_mitigation_product_quality_gate.py
      - name: Run error-mitigation product focused coverage
        run: >-
          python -m coverage run
          --rcfile=/dev/null
          --data-file=.coverage.error-mitigation-product-quality
          --branch
          -m pytest -q
          tests/test_error_mitigation_product.py
          tests/test_compound_mitigation.py
          tests/test_cpdr.py
          tests/test_mitiq_integration.py
          tests/test_symmetry_decay.py
      - name: Enforce error-mitigation product exact coverage
        run: >-
          python -m coverage report
          --rcfile=/dev/null
          --data-file=.coverage.error-mitigation-product-quality
          --precision=2 --show-missing
          --fail-under=100
          --include=*/error_mitigation_product.py,*/mitigation/compound_mitigation.py,*/mitigation/cpdr.py,*/mitigation/mitiq_integration.py,*/mitigation/symmetry_decay.py
