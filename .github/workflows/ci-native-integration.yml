          --precision=2 --show-missing
          --fail-under=100
          --include=*/qec/dla_protected_scar.py,*/qec/dla_protected_subspace.py
      - name: Run Rust DLA protected-memory parity tests
        run: cargo test --manifest-path scpn_quantum_engine/Cargo.toml --lib test_memory_
