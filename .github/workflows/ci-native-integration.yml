# SCPN Quantum Control — CI Native Integration
name: CI / Native Integration

on:
  workflow_call:
    inputs:
      prerequisite-results:
        required: true
        type: string

permissions:
  contents: read

jobs:
  ml-dsa-seal-quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
          python -m pip install --no-deps --require-hashes -r requirements-ci-studio-platform.txt
      - name: Download the Python 3.12 Rust engine wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: scpn-quantum-engine-3.12
          path: dist
      - name: Install the current Rust engine wheel
        run: python -m pip install --force-reinstall --no-deps dist/scpn_quantum_engine-*.whl
      - name: Type-check ML-DSA seal quality cohort
        run: >-
          python -m mypy --strict --explicit-package-bases
          src/scpn_quantum_control/crypto/ml_dsa_seal.py
          tools/ml_dsa_seal_quality_gates.py
          tests/test_ml_dsa_seal_quality_gate.py
      - name: Ruff NumPy docstrings for ML-DSA seal quality cohort
        run: >-
          python -m ruff check --isolated --select D,D413
          --config 'lint.pydocstyle.convention = "numpy"'
          src/scpn_quantum_control/crypto/ml_dsa_seal.py
          tests/test_ml_dsa_seal.py
          tests/test_result_pack_seal.py
          tests/test_qpu_result_pack_bridge.py
          tests/test_studio_qpu_result_pack.py
          tools/ml_dsa_seal_quality_gates.py
          tests/test_ml_dsa_seal_quality_gate.py
      - name: Run ML-DSA seal focused coverage
        run: >-
          python -m coverage run
          --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-ml-dsa-seal-quality.coverage
          --branch
          -m pytest -q
          tests/test_ml_dsa_seal.py
          tests/test_result_pack_seal.py
          tests/test_qpu_result_pack_bridge.py
          tests/test_studio_qpu_result_pack.py
      - name: Enforce ML-DSA seal exact coverage
        run: >-
          python -m coverage report
          --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-ml-dsa-seal-quality.coverage
          --precision=2 --show-missing
          --fail-under=100
          --include=*/crypto/ml_dsa_seal.py
