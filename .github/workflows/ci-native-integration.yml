  test:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src:${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            requirements-file: requirements-ci-py311-linux.txt
          - python-version: "3.12"
            requirements-file: requirements-ci-py312-linux.txt
          - python-version: "3.13"
            requirements-file: requirements-ci-py313-linux.txt
    steps:
      - name: Require every mandatory producer and test worker
        env:
          PREREQUISITE_RESULTS: ${{ inputs.prerequisite-results }}
        run: |
          python - <<'PY'
          import json
          import os
          results = json.loads(os.environ["PREREQUISITE_RESULTS"])
          expected = {"static-analysis", "native-build", "differentiable-control", "simulation-artifact", "framework-parity", "python-tests"}
          if set(results) != expected or any(value["result"] != "success" for value in results.values()):
              raise SystemExit("Mandatory shard or coverage producer did not succeed")
          PY
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: ./.github/actions/pinned-rust-toolchain
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r ${{ matrix.requirements-file }}
          python -m pip install --no-deps -e .
      - name: Install Studio recompute dependency
        run: |
          python -m pip install --no-deps --require-hashes -r requirements-ci-studio-platform.txt
      - name: Download the ABI-matched Rust engine wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: scpn-quantum-engine-${{ matrix.python-version }}
          path: dist
      - name: Install the current Rust engine wheel
        run: python -m pip install --force-reinstall --no-deps dist/scpn_quantum_engine-*.whl
      - name: Download the complete indexed profile evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: test-shard-python-${{ matrix.python-version }}-*-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-test-shards
      - name: Admit the complete compatibility profile
        if: matrix.python-version != '3.12'
        run: >-
          python -m tools.ci_test_shards verify "$RUNNER_TEMP/python-test-shards"
          --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          --python "${{ matrix.python-version }}" --shards 4
          --timings-output "$RUNNER_TEMP/ci-test-timings-cache/${{ matrix.python-version }}.json"
      - name: Audit test quality
        run: python tools/audit_test_quality.py
      - name: Download exact-commit native transform coverage (3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: native-transform-algebra-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/native-transform-coverage
      - name: Download exact-commit NQS qualification coverage (3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: nqs-ansatz-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/nqs-ansatz-coverage
      - name: Download exact-commit native tensor construction coverage (3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: native-tensor-construction-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/native-tensor-coverage
      - name: Download exact-commit native phase classifier coverage (3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: native-phase-classifier-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/native-phase-classifier-coverage
      - name: Download exact-commit native QNode arithmetic coverage (3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: native-qnode-arithmetic-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/native-qnode-arithmetic-coverage
      - name: Download exact-commit Phase-QNode Torch coverage (3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: phase-torch-bridge-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/phase-torch-coverage
      - name: Download exact-commit Phase-QNode PennyLane coverage (3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: phase-pennylane-bridge-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/phase-pennylane-coverage
      - name: Download exact-commit Phase-QNode JAX coverage (3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: phase-jax-qnode-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/phase-jax-coverage
      - name: Download exact-commit framework benchmark and example coverage (3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: framework-benchmark-examples-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/framework-benchmark-examples-coverage
      - name: Admit complete test coverage (3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          python -m tools.ci_test_shards verify "$RUNNER_TEMP/python-test-shards" \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --python 3.12 --shards 4 --coverage-output .coverage \
            --timings-output "$RUNNER_TEMP/ci-test-timings-cache/3.12.json"
          python -m coverage combine --append --keep "$RUNNER_TEMP/native-transform-coverage/native-transform.coverage"
          python -m coverage combine --append --keep "$RUNNER_TEMP/nqs-ansatz-coverage/scpn-qc-nqs-ansatz-quality.coverage"
          python -m coverage combine --append --keep "$RUNNER_TEMP/native-tensor-coverage/.coverage.differentiable-tensor-construction"
          python -m coverage combine --append --keep "$RUNNER_TEMP/native-phase-classifier-coverage/.coverage.phase-qnn-native-model"
          python -m coverage combine --append --keep "$RUNNER_TEMP/native-qnode-arithmetic-coverage/.coverage.phase-qnode-native-arithmetic"
          python -m coverage combine --append --keep "$RUNNER_TEMP/phase-torch-coverage/scpn-qc-phase-torch-bridge.coverage"
          python -m coverage combine --append --keep "$RUNNER_TEMP/phase-pennylane-coverage/scpn-qc-phase-pennylane-bridge.coverage"
          python -m coverage combine --append --keep "$RUNNER_TEMP/phase-jax-coverage/scpn-qc-phase-jax-qnode.coverage"
          python -m coverage combine --append --keep "$RUNNER_TEMP/framework-benchmark-examples-coverage/scpn-qc-framework-benchmark-examples.coverage"
          python -m coverage report --precision=2 --show-missing --fail-under=100 --include='*/phase/torch_qnode_transforms.py,*/phase/pennylane_import.py,*/phase_qnn_native_model.py,*/phase_qnn_native_contracts.py,*/phase_qnn_framework_gradients.py,*/phase_qnode_native_operators.py,*/phase_qnode_native_expectations.py,*/phase_qnode_gate_numerics.py,*/phase_qnode_state_evolution.py,*/phase_qnode_gate_dispatch.py,*/phase_qnode_native_gates.py,*/phase_qnode_statevector_engine.py,*/phase_qnode_native_statevector.py,*/differentiable_tree_vectors.py,*/differentiable_axis_compilation.py,*/phase/jax_qnode_transforms.py,*/phase_qnode_jax_audits.py,*/benchmarks/differentiable_programming_quantum.py,*/ml_examples/qnn_convergence.py'
          python -m coverage xml --include='*/scpn_quantum_control/*'
          python tools/audit_coverage_policy.py --coverage-xml coverage.xml
      - name: Audit coverage gaps (3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          python tools/audit_coverage_gaps.py --json > coverage-gap-audit.json
          python tools/audit_coverage_debt.py \
            --coverage-audit coverage-gap-audit.json \
            --check-current
      - name: Smoke-test DLA-parity validation CLI (3.12 only)
        if: matrix.python-version == '3.12'
        run: python scripts/run_dla_parity_suite.py --json > /tmp/dla_parity_result.json
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Save observed durations after mandatory profile success
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-test-timings-cache/${{ matrix.python-version }}.json
          key: ${{ runner.os }}-ci-test-timings-v1-${{ matrix.python-version }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload coverage policy evidence (3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-gap-audit-${{ matrix.python-version }}
          include-hidden-files: true
          path: |
            .coverage
            coverage.xml
            coverage-gap-audit.json
          if-no-files-found: error
          retention-days: 30
  # Cross-platform package smoke. The full scientific artefact and
  # documentation corpus is validated on Linux with the pinned Linux
  # lock above; this job verifies that the install/import/core-QEC
  # surface also works on macOS and Windows without pretending a
  # Linux wheel-hash lock is portable across operating systems.
  hardware-smoke:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - run: python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
      - name: Hardware tests (simulator only)
        run: pytest tests/test_hardware_runner.py -v --tb=short -k "simulator"
  integration-optional:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - run: python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
      - name: Install sc-neurocore
        run: python -m pip install --no-deps --require-hashes -r requirements-integration-sc-neurocore.txt
      - name: Run cross-repo integration tests
        run: pytest tests/test_snn_neurocore_e2e.py tests/test_cross_repo_wiring.py -v --tb=short
  studio-conformance:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install pinned CI surface, the package, and the studio federation extra
        run: |
          python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
          python -m pip install --no-deps -e .
          python -m pip install --no-deps --require-hashes -r requirements-ci-studio-platform.txt
      - name: Download the Python 3.12 Rust engine wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: scpn-quantum-engine-3.12
          path: dist
      - name: Install the current Rust engine wheel
        run: python -m pip install --force-reinstall --no-deps dist/scpn_quantum_engine-*.whl
      - name: Gate the studio federation surface against the platform contract
        run: >
          python -m pytest
          tests/test_studio_manifest.py
          tests/test_studio_evidence_bundle.py
          tests/test_studio_scorecard_bundle.py
          tests/test_studio_support_matrix_bundle.py
          tests/test_studio_recompute_kernel.py
          tests/test_studio_reference_validation.py
          tests/test_coverage_frontier.py
          tests/test_result_pack_seal.py
          tests/test_ml_dsa_seal.py
          tests/test_differentiable_transform_support_matrix_artifact.py
          tests/test_studio_xy_compile_recompute_artifact.py
          tests/test_studio_qpu_result_pack.py
          tests/test_studio_kuramoto_reference.py
          tests/test_studio_kuramoto_scenario_artifact.py
          tests/test_studio_program_ad_replay_artifact.py
          tests/test_studio_benchmark_databank_bundle.py
          -q
