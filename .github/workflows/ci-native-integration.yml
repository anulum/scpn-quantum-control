  fep-ffi-contract-quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: ./.github/actions/pinned-rust-toolchain
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
      - name: Download the Python 3.12 Rust engine wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: scpn-quantum-engine-3.12
          path: dist
      - name: Install the current Rust engine wheel
        run: python -m pip install --force-reinstall --no-deps dist/scpn_quantum_engine-*.whl
      - name: Confirm the installed extension exports the FEP surface
        run: |
          python - <<'GUARD'
          import scpn_quantum_engine as engine

          required = ("free_energy_gradient_rust", "variational_free_energy_rust", "brute_mpc")
          missing = [name for name in required if not hasattr(engine, name)]
          if missing:
              raise SystemExit(f"installed extension is missing {missing}")
          print(f"installed extension: {engine.__file__}")
          GUARD
      - name: Run Rust FEP boundary validation unit tests
        run: >-
          cargo test --manifest-path scpn_quantum_engine/Cargo.toml --lib
          validation::tests
      - name: Type-check the FEP FFI contract cohort
        run: >-
          python -m mypy --strict --explicit-package-bases
          tests/test_rust_ffi_validation.py
          tests/test_control_objective_conformance.py
          src/scpn_quantum_control/fep/variational_free_energy.py
      - name: Check control objective NumPy documentation
        run: >-
          python -m ruff check --isolated --preview --select D,D413,D417,D420
          --config 'lint.explicit-preview-rules = true'
          --config 'lint.pydocstyle.convention = "numpy"'
          src/scpn_quantum_control/fep/variational_free_energy.py
          tests/test_control_objective_conformance.py
      - name: Validate the installed FEP FFI numerical domain contract
        run: >-
          python -m pytest -q tests/test_rust_ffi_validation.py
          -k fep_domain_contract
      - name: Confirm the Python FEP tier agrees with the installed engine
        # Keep the original wall-clock assertions mandatory and uninstrumented.
        run: >-
          python -m pytest -q
          tests/test_fep.py
          tests/test_fep_generative_model_contract.py
          tests/test_control_objective_conformance.py
      - name: Measure belief objective branch coverage
        # TestPerformance executes above; tracing changes the measured workload.
        run: >-
          python -m coverage run --rcfile=/dev/null --branch
          --data-file=${{ runner.temp }}/scpn-qc-control-objective.coverage
          --include=src/scpn_quantum_control/fep/variational_free_energy.py
          -m pytest -q -k 'not TestPerformance'
          tests/test_fep.py
          tests/test_fep_generative_model_contract.py
          tests/test_control_objective_conformance.py
      - name: Enforce exact belief objective coverage
        run: >-
          python -m coverage report --rcfile=/dev/null
          --data-file=${{ runner.temp }}/scpn-qc-control-objective.coverage
          --precision=2 --show-missing --fail-under=100
