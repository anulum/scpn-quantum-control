# SCPN Quantum Control — CI Differentiable Control
name: CI / Differentiable Control

on:
  workflow_call:

permissions:
  contents: read

jobs:
  finite-size-scaling-quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
      - name: Type-check finite-size scaling quality cohort
        run: >-
          python -m mypy --strict --explicit-package-bases
          src/scpn_quantum_control/analysis/finite_size_scaling.py
          src/scpn_quantum_control/analysis/phase_diagram.py
          src/scpn_quantum_control/analysis/vortex_binding.py
          tests/test_finite_size_scaling.py
          tests/test_phase_diagram.py
          tests/test_vortex_binding.py
          tools/finite_size_scaling_quality_gates.py
          tests/test_finite_size_scaling_quality_gate.py
      - name: Ruff NumPy docstrings for finite-size scaling quality cohort
        run: >-
          python -m ruff check --isolated --preview --select D,D413,D417
          --config 'lint.explicit-preview-rules = true'
          --config 'lint.pydocstyle.convention = "numpy"'
          src/scpn_quantum_control/analysis/finite_size_scaling.py
          src/scpn_quantum_control/analysis/phase_diagram.py
          src/scpn_quantum_control/analysis/vortex_binding.py
          tests/test_finite_size_scaling.py
          tests/test_phase_diagram.py
          tests/test_vortex_binding.py
          tools/finite_size_scaling_quality_gates.py
          tests/test_finite_size_scaling_quality_gate.py
      - name: Run finite-size scaling focused coverage
        run: >-
          python -m coverage run
          --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-finite-size-scaling-quality.coverage
          --branch
          -m pytest -q
          tests/test_finite_size_scaling.py
          tests/test_phase_diagram.py
          tests/test_phase_diagram_branches.py
          tests/test_vortex_binding.py
      - name: Enforce finite-size scaling exact coverage
        run: >-
          python -m coverage report
          --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-finite-size-scaling-quality.coverage
          --precision=2 --show-missing
          --fail-under=100
          --include=*/analysis/finite_size_scaling.py,*/analysis/phase_diagram.py,*/analysis/vortex_binding.py
