# SCPN Quantum Control — CI Benchmark Evidence
name: CI / Benchmark Evidence

on:
  workflow_call:

permissions:
  contents: read

jobs:
  whole-program-ad-product-quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: {python-version: "3.12", cache: 'pip'}
      - run: python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
      - run: >-
          python -m mypy --strict --explicit-package-bases
          src/scpn_quantum_control/whole_program_ad_product.py
          src/scpn_quantum_control/whole_program_ad_api.py
          tests/test_whole_program_ad_product.py
          tests/test_whole_program_ad_contracts.py
          tests/test_whole_program_ad_runtime.py
          tools/whole_program_ad_product_quality_gates.py
          tests/test_whole_program_ad_product_quality_gate.py
      - run: >-
          python -m ruff check --isolated --preview --select D,D413,D417,D420
          --config 'lint.explicit-preview-rules = true'
          --config 'lint.pydocstyle.convention = "numpy"'
          src/scpn_quantum_control/whole_program_ad_product.py
          src/scpn_quantum_control/whole_program_ad_api.py
          tests/test_whole_program_ad_product.py
          tests/test_whole_program_ad_contracts.py
          tests/test_whole_program_ad_runtime.py
          tools/whole_program_ad_product_quality_gates.py
          tests/test_whole_program_ad_product_quality_gate.py
      - run: >-
          python -m coverage run --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-whole-program-ad-product-quality.coverage --branch
          -m pytest -q
          tests/test_whole_program_ad_product.py
          tests/test_whole_program_ad_contracts.py
          tests/test_whole_program_ad_runtime.py
          tests/test_whole_program_frontend.py
      - run: >-
          python -m coverage report --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-whole-program-ad-product-quality.coverage
          --precision=2 --fail-under=100
          --include=*/whole_program_ad_product.py,*/whole_program_ad_api.py
      - name: mypy-strict-differentiable-programming-contracts-quality
        run: >-
          python -m mypy --strict --explicit-package-bases
          src/scpn_quantum_control/benchmarks/differentiable_programming_contracts.py
          tests/test_differentiable_programming_contracts.py
          tools/differentiable_programming_contracts_quality_gates.py
          tests/test_differentiable_programming_contracts_quality_gate.py
      - name: ruff D differentiable-programming-contracts quality ratchet
        run: >-
          python -m ruff check --isolated --preview --select D,D413,D417,D420
          --config 'lint.explicit-preview-rules = true'
          --config 'lint.pydocstyle.convention = "numpy"'
          src/scpn_quantum_control/benchmarks/differentiable_programming_contracts.py
          tests/test_differentiable_programming_contracts.py
          tools/differentiable_programming_contracts_quality_gates.py
          tests/test_differentiable_programming_contracts_quality_gate.py
      - name: differentiable-programming-contracts focused coverage
        run: >-
          python -m coverage run --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-differentiable-programming-contracts-quality.coverage
          --branch -m pytest -q tests/test_differentiable_programming_contracts.py
      - name: differentiable-programming-contracts exact coverage threshold
        run: >-
          python -m coverage report --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-differentiable-programming-contracts-quality.coverage
          --precision=2 --fail-under=100
          --include=*/benchmarks/differentiable_programming_contracts.py
