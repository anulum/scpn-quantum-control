# SCPN Quantum Control — Strict docs build
#
# Runs `mkdocs build --strict` with the full optional-deps install so
# mkdocstrings can actually load every module referenced in
# `docs/autodoc.md`. This job GATES on warnings — broken internal
# anchors, dangling relative links, navigation inconsistencies, and
# mkdocstrings import failures all fail the build.
#
# `docs.yml` (deploy) stays separate and keeps running without
# `--strict` + without full deps so the GH-Pages site continues to
# publish even during short periods of doc flux.
name: Docs Strict Build

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "scpn_quantum_engine/**"
      - "studio-web/**"
      - ".github/workflows/docs-strict.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "scpn_quantum_engine/**"
      - "studio-web/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - run: python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
      - run: python -m pip install --no-deps -e oscillatools/
      - run: python -m pip install --no-deps -e .
      - run: mkdocs build --strict --site-dir /tmp/site-strict

  rust-reference:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - run: cargo doc --manifest-path scpn_quantum_engine/Cargo.toml --no-deps
      - run: cargo doc --manifest-path scpn_quantum_engine/program_ad_replay/Cargo.toml --no-deps
      - run: cargo doc --manifest-path scpn_quantum_engine/studio_program_ad_wasm/Cargo.toml --no-deps
      - run: cargo doc --manifest-path scpn_quantum_engine/studio_wasm_kernel/Cargo.toml --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rustdoc-reference
          path: |
            scpn_quantum_engine/target/doc
            scpn_quantum_engine/program_ad_replay/target/doc
            scpn_quantum_engine/studio_program_ad_wasm/target/doc
            scpn_quantum_engine/studio_wasm_kernel/target/doc
          if-no-files-found: error

  typescript-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          version: 10.32.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: studio-web/pnpm-lock.yaml
      - run: pnpm --dir studio-web install --frozen-lockfile
      - run: pnpm --dir studio-web docs:api
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: typedoc-reference
          path: build/api/typescript
          if-no-files-found: error

  docs-gate:
    if: always()
    needs: [build-strict, rust-reference, typescript-reference]
    runs-on: ubuntu-latest
    steps:
      - name: Require every language reference build
        run: |
          test "${{ needs.build-strict.result }}" = success
          test "${{ needs.rust-reference.result }}" = success
          test "${{ needs.typescript-reference.result }}" = success
