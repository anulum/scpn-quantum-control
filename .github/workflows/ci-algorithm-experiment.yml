# SCPN Quantum Control — CI Algorithm Experiment
name: CI / Algorithm Experiment

on:
  workflow_call:

permissions:
  contents: read

jobs:
  program-ad-alias-analysis-quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: {python-version: "3.12", cache: 'pip'}
      - name: Install pinned CI surface and the package
        run: |
          python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
          python -m pip install --no-deps -e .
      - name: Type-check Program AD alias-analysis quality cohort
        run: >-
          python -m mypy --strict --explicit-package-bases
          src/scpn_quantum_control/program_ad_alias_analysis.py
          tests/test_program_ad_alias_effects.py tests/test_program_ad_alias_contracts.py
          tools/program_ad_alias_analysis_quality_gates.py
          tests/test_program_ad_alias_analysis_quality_gate.py
      - name: Ruff NumPy docstrings for Program AD alias-analysis owners
        run: >-
          python -m ruff check --isolated --preview --select D,D413,D417,D420
          --config 'lint.explicit-preview-rules = true'
          --config 'lint.pydocstyle.convention = "numpy"'
          src/scpn_quantum_control/program_ad_alias_analysis.py
          tests/test_program_ad_alias_effects.py tests/test_program_ad_alias_contracts.py
          tools/program_ad_alias_analysis_quality_gates.py
          tests/test_program_ad_alias_analysis_quality_gate.py
      - name: Run public Program AD alias-analysis coverage
        run: >-
          python -m coverage run --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-program-ad-alias-analysis-quality.coverage --branch
          -m pytest -q tests/test_program_ad_alias_effects.py
          tests/test_program_ad_alias_contracts.py
      - name: Enforce Program AD alias-analysis exact coverage
        run: >-
          python -m coverage report --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-program-ad-alias-analysis-quality.coverage
          --precision=2 --fail-under=100 --include=*/program_ad_alias_analysis.py
