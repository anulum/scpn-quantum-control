          python -c "from scpn_quantum_control.analysis import DLAParityWitness; print(DLAParityWitness.__name__)"

  minimal-install:
    # A default `pip install scpn-quantum-control` ships no optional extras —
    # in particular no structlog. This leg reproduces that install and drives
    # the structured-logging fallback end to end, so structlog-style call
    # sites can never again crash a minimal install (2026-07-16 external
    # review: TypeError on the runner's first logged event).
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install the package with no extras
        # oscillatools is a core dependency vendored in-repo and not yet on
        # public PyPI — install the local tree first, exactly what a minimal
        # source install requires today.
        run: |
          pip install ./oscillatools
          pip install .
          pip install pytest hypothesis
      - name: Assert structlog is absent and the kwarg fallback is selected
        run: |
          if python -c "import structlog" 2>/dev/null; then
            echo "structlog unexpectedly present — this leg must run without it"
            exit 1
          fi
          python - <<'PY'
          from scpn_quantum_control.hardware import runner
          from scpn_quantum_control.structured_log_fallback import (
              KwargTolerantLoggerAdapter,
          )
          assert isinstance(runner._slog, KwargTolerantLoggerAdapter), type(runner._slog)
          runner._slog.info("backend_connected", backend="smoke", mode="simulator")
          PY
      - name: Run the fallback test surface on the minimal install
        run: pytest -q tests/test_structured_log_fallback.py tests/test_hardware_runner_branches.py

  differentiable-parity:
    needs: lint
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src:${{ github.workspace }}
      RUNNER_ENVIRONMENT: github-hosted
      RUNNER_LABELS: ubuntu-latest,linux
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install pinned CI dependency surface
        run: |
          python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
          python -m pip install --no-deps -e .
      - name: Build CPU-only differentiable framework overlay
        run: |
          # CPU wheels: jax[cpu], tensorflow-cpu, pennylane, torch.
          export SCPN_FRAMEWORK_OVERLAY="$RUNNER_TEMP/scpn-qc-framework-site-py312"
          install-differentiable-framework-overlay --overlay-path "$SCPN_FRAMEWORK_OVERLAY" --install
          echo "PYTHONPATH=$SCPN_FRAMEWORK_OVERLAY:$PYTHONPATH" >> "$GITHUB_ENV"
          install-differentiable-framework-overlay --overlay-path "$SCPN_FRAMEWORK_OVERLAY" --verify
      - name: Verify real JAX runtime for Phase-QNode coverage
        run: >-
          python -c
          "import jax; devices=jax.devices();
          print(f'JAX {jax.__version__}; devices={devices}; primary={devices[0]}')"
      - name: Run Phase-QNode JAX focused coverage
        run: >-
          python -m coverage run
          --rcfile=/dev/null
          --data-file=.coverage.phase-jax-qnode
          --branch
          --source=src/scpn_quantum_control/phase
          -m pytest -q
          tests/test_phase_jax_qnode_transforms.py
          tests/test_phase_jax_qnode_transforms_integration.py
          tests/test_phase_jax_bridge_aot_export.py
          tests/test_phase_jax_qnode_input_validation.py
          tests/test_phase_jax_qnode_pytree_validation.py
          tests/test_phase_jax_qnode_aot_validation.py
          tests/test_phase_jax_qnode_statevector_edges.py
      - name: Enforce Phase-QNode JAX exact coverage
        run: >-
          python -m coverage report
          --rcfile=/dev/null
          --data-file=.coverage.phase-jax-qnode
          --precision=2
          --fail-under=100
          --include=*/jax_qnode_transforms.py
      - name: Run differentiable parity tests
        run: >
          pytest
          tests/test_differentiable_framework_overlay.py
          tests/test_differentiable_external_comparisons.py
          tests/test_phase_qnode_framework_parity.py
          -q
      - name: Generate functional_non_isolated differentiable evidence
        run: |
          echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
          echo "GITHUB_SHA=$GITHUB_SHA"
          mkdir -p differentiable-benchmark-evidence
          python scripts/run_differentiable_benchmark_evidence.py \
            --output-dir differentiable-benchmark-evidence
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("differentiable-benchmark-evidence/diff-qnode-ci-evidence-schema-v1.json").read_text()
          )
          external_payload = json.loads(
              Path("differentiable-benchmark-evidence/diff-qnode-external-comparison.json").read_text()
          )
          if payload["metadata"]["classification"] != "functional_non_isolated":
              raise SystemExit("GitHub-hosted benchmark evidence must remain functional_non_isolated")
          if external_payload["classification"] != "functional_non_isolated":
              raise SystemExit("External comparison evidence must remain functional_non_isolated")
          if external_payload["artifact_id"] not in payload["evidence_artifact_ids"]:
              raise SystemExit("Benchmark evidence must reference the external comparison artefact ID")
          PY
      - name: Assert non-provider benchmark boundary
        run: grep -R "No provider or QPU execution" differentiable-benchmark-evidence
      - name: Upload functional_non_isolated differentiable evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: differentiable-functional-non-isolated-evidence
          path: differentiable-benchmark-evidence/
          retention-days: 30

  # Self-hosted execution is reserved for explicit maintainer dispatch on main.
  differentiable-isolated-benchmark:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_isolated_benchmark == true &&
      github.ref == 'refs/heads/main'
    needs: lint
    runs-on: [self-hosted, linux, isolated-benchmark]
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src:${{ github.workspace }}
      RUNNER_ENVIRONMENT: self-hosted
      RUNNER_LABELS: self-hosted,linux,isolated-benchmark
      SCPN_BENCH_CPU_AFFINITY: "0"
      SCPN_BENCH_ISOLATION_METHOD: taskset+chrt
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install pinned CI dependency surface
        run: |
          python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
          python -m pip install --no-deps -e .
      - name: Run isolated differentiable benchmark evidence
        run: |
          mkdir -p differentiable-isolated-benchmark-evidence
          taskset -c "$SCPN_BENCH_CPU_AFFINITY" chrt -f 1 \
            python scripts/run_differentiable_benchmark_evidence.py \
              --output-dir differentiable-isolated-benchmark-evidence \
              --cpu-affinity "$SCPN_BENCH_CPU_AFFINITY" \
              --isolation-method "$SCPN_BENCH_ISOLATION_METHOD"
          grep '"classification": "isolated_affinity"' \
            differentiable-isolated-benchmark-evidence/diff-qnode-ci-evidence-schema-v1.json
          grep '"classification": "functional_non_isolated"' \
            differentiable-isolated-benchmark-evidence/diff-qnode-external-comparison.json
      - name: Upload isolated differentiable benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: differentiable-isolated-benchmark-evidence
          path: differentiable-isolated-benchmark-evidence/
          retention-days: 30

  security:
    needs: lint
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - run: pip install --require-hashes -r requirements-ci-py312-linux.txt
      - run: python tools/audit_serialization_surface.py
      - run: bandit -r src/ scripts/ -ll -q
      - name: Verify the constrained dependency advisory waiver
        run: |
          python -m mypy --strict --explicit-package-bases \
            tools/audit_dependency_security_waiver.py \
            tools/yaml_mapping_key_audit.py \
            tests/test_audit_dependency_security_waiver.py
          python -m ruff check --isolated --select D,D413 \
            --config 'lint.pydocstyle.convention = "numpy"' \
            tools/audit_dependency_security_waiver.py \
            tools/yaml_mapping_key_audit.py \
            tests/test_audit_dependency_security_waiver.py
          python -m coverage run --rcfile=/dev/null \
            --data-file=.coverage.dependency-security-waiver --branch \
            -m pytest -q tests/test_audit_dependency_security_waiver.py
          python -m coverage report --rcfile=/dev/null \
            --data-file=.coverage.dependency-security-waiver --precision=2 \
            --fail-under=100 \
            --include='*/audit_dependency_security_waiver.py,*/yaml_mapping_key_audit.py'
      - run: python tools/audit_dependency_security_waiver.py
      # Audit the full hash-pinned CI lock — every transitive pin the CI jobs
      # actually install — rather than the top-level dev inputs. `--no-deps`
      # because the lock is already a complete closure. The former
      # CVE-2026-4539 (pygments ≤2.19.2) exception is obsolete: the lock pins
      # pygments 2.20.0. The only active exception is fail-closed by the waiver
      # audit above and documented in docs/test_infrastructure.md.
      - run: pip-audit -r requirements-ci-py312-linux.txt --no-deps --desc on --ignore-vuln PYSEC-2026-3447

  rust-audit:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scpn_quantum_engine
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Cache cargo registry + advisory database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/advisory-db
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('scpn_quantum_engine/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-
      - name: Install cargo-audit
        env:
          CARGO_HTTP_MULTIPLEXING: "false"
        run: |
          for attempt in 1 2 3; do
            cargo install cargo-audit --locked --version 0.22.1 && exit 0
            sleep $((attempt * 10))
          done
          cargo install cargo-audit --locked --version 0.22.1
      - name: Audit Rust dependency advisories
        run: cargo audit --deny warnings
      - name: Run Rust engine tests
        run: cargo test --locked

