# SCPN Quantum Control — CI Coordinator
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_isolated_benchmark:
        description: "Run the self-hosted isolated benchmark job on main only."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    uses: ./.github/workflows/ci-static-analysis.yml
  native-build:
    needs: static-analysis
    uses: ./.github/workflows/ci-native-build.yml
  core-science:
    needs: static-analysis
    uses: ./.github/workflows/ci-core-science.yml
  control-provider:
    needs: static-analysis
    uses: ./.github/workflows/ci-control-provider.yml
  topology-evidence:
    needs: static-analysis
    uses: ./.github/workflows/ci-topology-evidence.yml
  differentiable-control:
    needs: static-analysis
    uses: ./.github/workflows/ci-differentiable-control.yml
  compiler-cosimulation:
    needs: static-analysis
    uses: ./.github/workflows/ci-compiler-cosimulation.yml
  analysis-model:
    needs: static-analysis
    uses: ./.github/workflows/ci-analysis-model.yml
  algorithm-experiment:
    needs: static-analysis
    uses: ./.github/workflows/ci-algorithm-experiment.yml
  simulation-artifact:
    needs: static-analysis
    uses: ./.github/workflows/ci-simulation-artifact.yml
  product-deployment:
    needs: static-analysis
    uses: ./.github/workflows/ci-product-deployment.yml
  assurance-policy:
    needs: static-analysis
    uses: ./.github/workflows/ci-assurance-policy.yml
  benchmark-evidence:
    needs: static-analysis
    uses: ./.github/workflows/ci-benchmark-evidence.yml
  application-domain:
    needs: static-analysis
    uses: ./.github/workflows/ci-application-domain.yml
  whole-program-trace:
    needs: static-analysis
    uses: ./.github/workflows/ci-whole-program-trace.yml
  runtime-package:
    needs: static-analysis
    uses: ./.github/workflows/ci-runtime-package.yml
  framework-parity:
    needs: static-analysis
    uses: ./.github/workflows/ci-framework-parity.yml
    with:
      run_isolated_benchmark: ${{ inputs.run_isolated_benchmark }}
  security:
    needs: static-analysis
    uses: ./.github/workflows/ci-security.yml
  studio:
    needs: static-analysis
    uses: ./.github/workflows/ci-studio.yml
  native-integration:
    needs: [static-analysis, native-build]
    uses: ./.github/workflows/ci-native-integration.yml

  ci-gate:
    needs: [static-analysis, native-build, core-science, control-provider, topology-evidence, differentiable-control, compiler-cosimulation, analysis-model, algorithm-experiment, simulation-artifact, product-deployment, assurance-policy, benchmark-evidence, application-domain, whole-program-trace, runtime-package, framework-parity, security, studio, native-integration]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all CI categories passed
        env:
          CATEGORY_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          results = json.loads(os.environ["CATEGORY_RESULTS"])
          failures = {name: value["result"] for name, value in results.items() if value["result"] != "success"}
          if failures:
              raise SystemExit(f"CI category gate failed: {failures}")
          print("CI category gate passed")
          PY
