# SCPN Quantum Control — Ci
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_isolated_benchmark:
        description: "Run the self-hosted isolated benchmark job on main only."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # The differentiable promotion-language audit imports scpn_quantum_control, which
      # now imports the standalone oscillatools distribution; expose its source tree.
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - run: pip install --require-hashes -r requirements-ci-py312-linux.txt
      - name: Verify the lock-faithful CI build environment
        run: |
          python -m mypy --strict --explicit-package-bases \
            tools/audit_ci_build_environment.py \
            tests/test_audit_ci_build_environment.py
          python -m ruff check \
            tools/audit_ci_build_environment.py \
            tests/test_audit_ci_build_environment.py
          python -m ruff format --check \
            tools/audit_ci_build_environment.py \
            tests/test_audit_ci_build_environment.py
          python -m ruff check --isolated --select D,D413 \
            --config 'lint.pydocstyle.convention = "numpy"' \
            tools/audit_ci_build_environment.py \
            tests/test_audit_ci_build_environment.py
          python -m bandit -q tools/audit_ci_build_environment.py
          python -m coverage run --rcfile=/dev/null \
            --data-file=.coverage.ci-build-environment --branch \
            -m pytest -q tests/test_audit_ci_build_environment.py
          python -m coverage report --rcfile=/dev/null \
            --data-file=.coverage.ci-build-environment --precision=2 \
            --fail-under=100 \
            --include='*/audit_ci_build_environment.py'
          python tools/audit_ci_build_environment.py
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - name: Audit documentation surface
        run: >
          python tools/audit_documentation_surface.py
          --allowlist tools/documentation_surface_allowlist.json
          --fail-on-findings
      - name: Enforce the published-record freeze (read-only preprints)
        run: |
          python -m mypy --strict --explicit-package-bases \
            tools/check_published_record_freeze.py \
            tests/test_check_published_record_freeze.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_check_published_record_freeze.py
          python tools/check_published_record_freeze.py
      - name: Enforce retired public claims (no silent revivals)
        run: |
          python -m mypy --strict --explicit-package-bases \
            tools/check_retired_claims.py \
            tests/test_check_retired_claims.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_check_retired_claims.py
          python tools/check_retired_claims.py
      - name: Audit tracked module responsibilities
        run: python tools/audit_module_size_policy.py
      - name: Type-check module-responsibility audit
        run: mypy --strict tools/audit_module_size_policy.py
      - name: Enforce descriptive production naming
        run: |
          python -m mypy --strict --explicit-package-bases \
            tools/audit_descriptive_production_naming.py \
            tests/test_audit_descriptive_production_naming.py
          python -m ruff check \
            tools/audit_descriptive_production_naming.py \
            tests/test_audit_descriptive_production_naming.py
          python -m ruff format --check \
            tools/audit_descriptive_production_naming.py \
            tests/test_audit_descriptive_production_naming.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_audit_descriptive_production_naming.py
          python tools/audit_descriptive_production_naming.py
      - name: Audit licence readiness and canonical source headers
        run: python tools/audit_license_readiness.py
      - name: Type-check licence readiness audit
        run: mypy --strict tools/audit_license_readiness.py
      - name: Audit additive strict test-typing cohort
