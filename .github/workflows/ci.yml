  studio-web:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          version: 11.9.0
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck (TS strict)
        run: pnpm typecheck
      - name: Add the WASM build target
        run: rustup target add wasm32-unknown-unknown
      - name: Build the WASM kernel (browser recompute path needs it at test time)
        working-directory: scpn_quantum_engine/studio_wasm_kernel
        run: cargo build --release --locked --target wasm32-unknown-unknown
      - name: Assert the program-AD replay crate stays WASM-portable
        working-directory: scpn_quantum_engine/program_ad_replay
        run: cargo build --release --locked --target wasm32-unknown-unknown
      - name: Build the program-AD WASM kernel
        working-directory: scpn_quantum_engine/studio_program_ad_wasm
        run: cargo build --release --locked --target wasm32-unknown-unknown
      - name: Test the program-AD WASM kernel
        working-directory: scpn_quantum_engine/studio_program_ad_wasm
        run: cargo test --locked
      - name: Test with enforced coverage thresholds
        run: pnpm test:coverage
      - name: Enforce Program-AD browser owner exact coverage
        run: >-
          pnpm exec vitest run
          src/panel/programAd.test.ts
          src/panel/ProgramADReplayCard.test.tsx
          --coverage
          --coverage.reporter=text
          --coverage.include=src/panel/programAd.ts
          --coverage.include=src/panel/ProgramADReplayCard.tsx
          --coverage.thresholds.statements=100
          --coverage.thresholds.branches=100
          --coverage.thresholds.functions=100
          --coverage.thresholds.lines=100
      - name: Build the portal and the federation remote
        run: pnpm build
      - name: Assert the ESM remote entry carries the locked federation name
        run: |
          test -f dist/remoteEntry.js
          grep -q "scpn_quantum_control" dist/remoteEntry.js
      - name: Ship the WASM kernel into the bundle + write the deploy manifest
        working-directory: .
        run: python3 tools/build_studio_wasm_bundle.py
      - name: Assert the deploy manifest content-addresses the shipped bundle
        working-directory: .
        run: |
          test -f studio-web/dist/deploy-manifest.json
