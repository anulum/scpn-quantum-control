# SCPN Quantum Control — CI Static Analysis
name: CI / Static Analysis

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # The differentiable promotion-language audit imports scpn_quantum_control, which
      # now imports the standalone oscillatools distribution; expose its source tree.
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - run: pip install --require-hashes -r requirements-ci-py312-linux.txt
      - name: Verify the lock-faithful CI build environment
        run: |
          python -m mypy --strict --explicit-package-bases \
            tools/audit_ci_build_environment.py \
            tests/test_audit_ci_build_environment.py
          python -m ruff check \
            tools/audit_ci_build_environment.py \
            tests/test_audit_ci_build_environment.py
          python -m ruff format --check \
            tools/audit_ci_build_environment.py \
            tests/test_audit_ci_build_environment.py
          python -m ruff check --isolated --select D,D413 \
            --config 'lint.pydocstyle.convention = "numpy"' \
            tools/audit_ci_build_environment.py \
            tests/test_audit_ci_build_environment.py
          python -m bandit -q tools/audit_ci_build_environment.py
          python -m coverage run --rcfile=/dev/null \
            --data-file=.coverage.ci-build-environment --branch \
            -m pytest -q tests/test_audit_ci_build_environment.py
          python -m coverage report --rcfile=/dev/null \
            --data-file=.coverage.ci-build-environment --precision=2 --show-missing \
            --fail-under=100 \
            --include='*/audit_ci_build_environment.py'
          python tools/audit_ci_build_environment.py
      - name: Guard distributed CI workflow modularity
        run: |
          python -m mypy --strict --explicit-package-bases \
            tools/ci_workflow_inventory.py \
            tools/audit_ci_workflow_modularity.py \
            tests/test_ci_workflow_modularity.py
          python -m ruff check \
            tools/ci_workflow_inventory.py \
            tools/audit_ci_workflow_modularity.py \
            tests/test_ci_workflow_modularity.py
          python -m ruff format --check \
            tools/ci_workflow_inventory.py \
            tools/audit_ci_workflow_modularity.py \
            tests/test_ci_workflow_modularity.py
          python -m ruff check --isolated --select D,D413 \
            --config 'lint.pydocstyle.convention = "numpy"' \
            tools/ci_workflow_inventory.py \
            tools/audit_ci_workflow_modularity.py \
            tests/test_ci_workflow_modularity.py
          python -m bandit -q \
            tools/ci_workflow_inventory.py \
            tools/audit_ci_workflow_modularity.py
          python -m coverage run --rcfile=/dev/null \
            --data-file=.coverage.ci-workflow-modularity --branch \
            -m pytest -q tests/test_ci_workflow_modularity.py
          python -m coverage report --rcfile=/dev/null \
            --data-file=.coverage.ci-workflow-modularity --precision=2 \
            --show-missing \
            --fail-under=100 \
            --include='*/ci_workflow_inventory.py,*/audit_ci_workflow_modularity.py'
          python tools/audit_ci_workflow_modularity.py
      - run: ruff check src/ tests/ examples/ figures/ tools/ scripts/ notebooks/ run_hardware.py
      - run: ruff format --check src/ tests/ examples/ figures/ tools/ scripts/ notebooks/ run_hardware.py
      - name: Audit documentation surface
        run: >
          python tools/audit_documentation_surface.py
          --allowlist tools/documentation_surface_allowlist.json
          --fail-on-findings
      - name: Enforce the published-record freeze (read-only preprints)
        run: |
          python -m mypy --strict --explicit-package-bases \
            tools/check_published_record_freeze.py \
            tests/test_check_published_record_freeze.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_check_published_record_freeze.py
          python tools/check_published_record_freeze.py
      - name: Enforce retired public claims (no silent revivals)
        run: |
          python -m mypy --strict --explicit-package-bases \
            tools/check_retired_claims.py \
            tests/test_check_retired_claims.py
          python -m pytest -q -p no:cacheprovider \
