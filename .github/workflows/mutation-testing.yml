# SCPN Quantum Control — Mutation testing (mutmut) weekly
#
# Runs every recorded mutation target with the pinned mutmut release and
# compares the outcome with `tools/mutation_survivor_ceiling.json`. The job
# fails when the tool cannot run, when a mutant is left untested, and when
# survivors or timeouts rise above their ceiling. Outcome categories and the
# way to lower or re-record the ceiling are in `docs/mutation_testing.md`.
name: Mutation Testing

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install the locked environment and the pinned mutation tool
        run: |
          python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
          python -m pip install --no-deps -e oscillatools/
          python -m pip install --no-deps -e .
          python -m pip install --require-hashes -r requirements-ci-mutation.txt
      - name: Hold the mutation survivor ceiling
        shell: bash
        run: |
          python tools/audit_mutation_survivors.py --workspace "$RUNNER_TEMP" 2>&1 \
            | tee mutation-survivors.txt
      - name: Summarise
        if: always()
        run: |
          {
            echo "## Mutation testing — weekly run"
            echo
            echo '```'
            if [ -f mutation-survivors.txt ]; then
              head -80 mutation-survivors.txt
            else
              echo "no result file: the gate did not start"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the gate output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mutation-survivors
          path: mutation-survivors.txt
          retention-days: 365
          if-no-files-found: warn
