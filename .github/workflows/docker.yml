# SCPN Quantum Control — Docker
name: Docker

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".pre-commit-config.yaml"
      - ".github/workflows/docker.yml"
      - "Dockerfile"
      - "pyproject.toml"
      - "requirements*.txt"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "scripts/**"
      - "docs/**"
      - "paper/**"
      - "examples/**"
      - "notebooks/**"
      - "results/**"
      - "data/**"
      - "figures/**"
  workflow_dispatch:

jobs:
  docker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The container suite outgrew one 45-minute runner. Four workers run the
    # same admitted selection; the shard plugin partitions the collected items
    # deterministically, so together they run every test exactly once.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Build Docker image
        run: docker build -t scpn-quantum-control:test .

      # Admission checks inspect live cgroup metadata without allocating the
      # declared buffers. Equal memory/swap limits prohibit extra swap allowance.
      - name: Verify memory-limited dense admission
        timeout-minutes: 3
        run: |
          set -euo pipefail
          for limit in 1073741824 2147483648; do
            docker run --rm --network none --cpus 1 \
              --memory "$limit" --memory-swap "$limit" --pids-limit 128 \
              --env OPENBLAS_NUM_THREADS=1 --env OMP_NUM_THREADS=1 \
              scpn-quantum-control:test \
              timeout 60s python tools/check_container_memory_budget.py --limit-bytes "$limit"
          done

      - name: Run tests in Docker
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          docker run --rm \
            --env TEST_SHARD --env GITHUB_SHA --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            scpn-quantum-control:test \
            sh -c 'python -m tools.ci_test_shards snapshot --source /tmp/cold-timings.json --output /tmp/timings.json \
              && exec pytest tests/ -p tools.pytest_ci_shard \
                --ci-suite docker --ci-shard "$TEST_SHARD" --ci-shards 4 \
                --ci-output "/tmp/docker-shard-$TEST_SHARD" --ci-timings /tmp/timings.json \
                --ci-source-sha "$GITHUB_SHA" --ci-run-id "$GITHUB_RUN_ID" --ci-attempt "$GITHUB_RUN_ATTEMPT" \
                -v --tb=short -o cache_dir=/home/sqc/.cache/pytest \
                -m "not slow and not hardware and not internal_corpus and not performance and not framework_imports"'

      - name: Verify offline LLM-QPU baseline sandbox
        if: matrix.shard == 1
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=16m \
            --env IQM_TOKEN=poison --env IBM_QUANTUM_TOKEN=poison \
            scpn-quantum-control:test \
            python tools/llm_qpu_baseline_gate.py offline-container-probe

      - name: Verify import
        if: matrix.shard == 1
        run: docker run --rm scpn-quantum-control:test python -c "import scpn_quantum_control; print(f'v{scpn_quantum_control.__version__}')"
