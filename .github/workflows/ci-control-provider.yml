      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
      - name: Type-check hardware HAL quality cohort
        run: >-
          python -m mypy --strict --explicit-package-bases
          src/scpn_quantum_control/hardware/hal.py
          src/scpn_quantum_control/hardware/async_runner.py
          src/scpn_quantum_control/hardware/circuit_cutting.py
          src/scpn_quantum_control/hardware/circuit_export.py
          src/scpn_quantum_control/hardware/fast_classical.py
          src/scpn_quantum_control/hardware/iqm_backend.py
          src/scpn_quantum_control/hardware/aggregators.py
          src/scpn_quantum_control/hardware/provider_capability_core.py
          tests/test_async_runner.py
          tests/test_circuit_cutting.py
          tests/test_circuit_export.py
          tests/test_fast_classical.py
          tests/test_iqm_backend.py
          tests/test_aggregators_branches.py
          tests/test_hardware_hal_provider_conformance.py
          tests/test_provider_capability_core.py
          tools/hardware_hal_quality_gates.py
          tests/test_hardware_hal_quality_gate.py
      - name: Ruff NumPy docstrings for hardware HAL quality cohort
        run: >-
          python -m ruff check --isolated --select D,D413
          --config 'lint.pydocstyle.convention = "numpy"'
          src/scpn_quantum_control/hardware/hal.py
          src/scpn_quantum_control/hardware/async_runner.py
          src/scpn_quantum_control/hardware/circuit_cutting.py
          src/scpn_quantum_control/hardware/circuit_export.py
          src/scpn_quantum_control/hardware/fast_classical.py
          src/scpn_quantum_control/hardware/iqm_backend.py
          src/scpn_quantum_control/hardware/aggregators.py
          src/scpn_quantum_control/hardware/provider_capability_core.py
          tests/test_hardware_hal.py
          tests/test_async_runner.py
          tests/test_circuit_cutting.py
          tests/test_circuit_export.py
          tests/test_fast_classical.py
          tests/test_iqm_backend.py
          tests/test_aggregators_branches.py
          tests/test_hardware_hal_provider_conformance.py
          tests/test_provider_capability_core.py
          tools/hardware_hal_quality_gates.py
          tests/test_hardware_hal_quality_gate.py
      - name: Run hardware HAL focused coverage
        run: >-
          python -m coverage run
          --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-hardware-hal-quality.coverage
          --branch
          -m pytest -q
          tests/test_hardware_hal.py
          tests/test_hardware_hal_contract_guards.py
          tests/test_hardware_hal_count_integrity_contract.py
          tests/test_hardware_hal_provider_id_contract.py
          tests/test_hardware_hal_status_normalisation_contract.py
          tests/test_async_runner.py
          tests/test_circuit_cutting.py
          tests/test_circuit_export.py
          tests/test_fast_classical.py
          tests/test_iqm_backend.py
          tests/test_aggregators_branches.py
          tests/test_hardware_hal_provider_conformance.py
          tests/test_provider_capability_core.py
      - name: Enforce hardware HAL exact coverage
        run: >-
          python -m coverage report
          --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-hardware-hal-quality.coverage
          --precision=2
          --fail-under=100
          --include=*/hardware/hal.py,*/hardware/async_runner.py,*/hardware/circuit_cutting.py,*/hardware/circuit_export.py,*/hardware/fast_classical.py,*/hardware/iqm_backend.py,*/hardware/aggregators.py,*/hardware/provider_capability_core.py
