# SCPN Quantum Control — CI Whole Program Trace
name: CI / Whole Program Trace

on:
  workflow_call:

permissions:
  contents: read

jobs:
  whole-program-trace-value-quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
      - name: Run adjoint replay product focused coverage
        run: >-
          python -m coverage run
          --rcfile=/dev/null
          --data-file=.coverage.adjoint-replay-product-quality
          --branch
          -m pytest -q
          tests/test_adjoint_replay_product.py
      - name: Enforce adjoint replay product exact coverage
        run: >-
          python -m coverage report
          --rcfile=/dev/null
          --data-file=.coverage.adjoint-replay-product-quality
          --precision=2 --show-missing
          --fail-under=100
          --include=*/adjoint_replay_product.py
      - name: Run differentiable scalar-kernel focused coverage
        run: >-
          python -m coverage run
          --rcfile=/dev/null
          --data-file=.coverage.scalar-kernels-quality
          --branch
          -m pytest -q
          tests/test_differentiable_scalar_kernels.py
          tests/test_differentiable_transform_helpers.py
      - name: Enforce differentiable scalar-kernel exact coverage
        run: >-
          python -m coverage report
          --rcfile=/dev/null
          --data-file=.coverage.scalar-kernels-quality
          --precision=2 --show-missing
          --fail-under=100
          --include=*/differentiable_scalar_kernels.py
      - name: Run differentiable Rust/Python inventory focused coverage
        run: >-
          python -m coverage run
          --rcfile=/dev/null
          --data-file=.coverage.rust-python-inventory-quality
          --branch
          -m pytest -q
          tests/test_differentiable_rust_python_inventory.py
      - name: Enforce differentiable Rust/Python inventory exact coverage
        run: >-
          python -m coverage report
          --rcfile=/dev/null
          --data-file=.coverage.rust-python-inventory-quality
          --precision=2 --show-missing
          --fail-under=100
          --include=*/differentiable_rust_python_inventory.py
      - name: Run unified differentiable API focused coverage
        run: >-
          python -m coverage run
          --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-differentiable-api-quality.coverage
          --branch
          -m pytest -q
          tests/test_differentiable_api.py
          tests/test_differentiable_api_contracts.py
          tests/test_differentiable_canonical_modes.py
          tests/test_differentiable_package_exports.py
          tests/test_differentiable_result_contracts.py
          tests/test_transform_algebra.py
          -k 'not unified_differentiable_benchmark_report_is_non_performance_evidence'
      - name: Enforce unified differentiable API exact coverage
        run: >-
          python -m coverage report
          --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-differentiable-api-quality.coverage
          --precision=2 --show-missing
          --fail-under=100
          --include=*/differentiable_api.py,*/differentiable_canonical_api.py,*/differentiable_result_contracts.py
      - name: Run differentiable Levenberg-Marquardt focused coverage
        run: >-
          python -m coverage run
          --rcfile=/dev/null
          --data-file=.coverage.levenberg-marquardt-quality
          --branch
          -m pytest -q
          tests/test_differentiable_levenberg_marquardt.py
          tests/test_differentiable_custom_derivatives.py
      - name: Enforce differentiable Levenberg-Marquardt exact coverage
        run: >-
          python -m coverage report
          --rcfile=/dev/null
          --data-file=.coverage.levenberg-marquardt-quality
          --precision=2 --show-missing
          --fail-under=100
          --include=*/differentiable_levenberg_marquardt.py
      - name: Run differentiable natural-gradient focused coverage
        run: >-
          python -m coverage run
          --rcfile=/dev/null
          --data-file=.coverage.natural-gradient-quality
          --branch
          -m pytest -q
          tests/test_differentiable_natural_gradient.py
          tests/test_differentiable_natural_gradient_line_search.py
          tests/test_differentiable_gradient_descent_optimizer.py
      - name: Enforce differentiable natural-gradient exact coverage
        run: >-
          python -m coverage report
          --rcfile=/dev/null
          --data-file=.coverage.natural-gradient-quality
          --precision=2 --show-missing
          --fail-under=100
          --include=*/differentiable_natural_gradient.py,*/differentiable_gradient_descent.py
      - name: Run Program-AD array-indexing focused coverage
        run: >-
          python -m coverage run
          --rcfile=/dev/null
          --data-file=.coverage.program-ad-array-indexing
          --branch
          -m pytest -q
          tests/test_program_ad_array_indexing_registry.py
          tests/test_program_ad_structural_finite_difference_gradient_check.py
          tests/test_program_ad_fail_closed_boundaries.py
          tests/test_program_ad_array_indexing_quality.py
      - name: Enforce Program-AD array-indexing exact coverage
        run: >-
          python -m coverage report
          --rcfile=/dev/null
          --data-file=.coverage.program-ad-array-indexing
          --precision=2 --show-missing
          --fail-under=100
          --include=*/program_ad_array_indexing.py
      - name: Run whole-program trace-value focused coverage
        run: >-
          python -m coverage run
          --rcfile=/dev/null
          --data-file=.coverage.whole-program-trace-values
          --branch
          -m pytest -q
          tests/test_program_ad_adjoint_generation.py
          tests/test_program_ad_adjoint_generation_docstrings.py
          tests/test_program_ad_alias_contracts.py
          tests/test_program_ad_alias_effects.py
          tests/test_program_ad_array_indexing_registry.py
          tests/test_program_ad_array_indexing_quality.py
          tests/test_program_ad_binary_elementwise_registry.py
          tests/test_program_ad_broadcast_assembly.py
          tests/test_program_ad_cumulative_primitives.py
          tests/test_program_ad_cumulative_primitives_docstrings.py
          tests/test_program_ad_effect_ir.py
          tests/test_program_ad_elementwise_registry.py
          tests/test_program_ad_fail_closed_boundaries.py
          tests/test_program_ad_finite_difference_gradient_check.py
          tests/test_program_ad_finite_difference_stencils.py
          tests/test_program_ad_interpolation.py
          tests/test_program_ad_interpolation_primitives_docstrings.py
          tests/test_program_ad_like_constructors.py
          tests/test_program_ad_linalg_core.py
          tests/test_program_ad_linalg_direct_rules.py
          tests/test_program_ad_linalg_matrix_ops.py
          tests/test_program_ad_linalg_registry.py
          tests/test_program_ad_linalg_spectral.py
          tests/test_program_ad_linalg_exact_contracts.py
          tests/test_program_ad_product_contractions.py
          tests/test_program_ad_reduction_norms.py
          tests/test_program_ad_reduction_primitives_docstrings.py
          tests/test_program_ad_registry.py
          tests/test_program_ad_runtime_registry_dispatch.py
          tests/test_program_ad_selection_direct_rules.py
          tests/test_program_ad_selection_folds.py
          tests/test_program_ad_selection_order_statistics.py
          tests/test_program_ad_selection_primitives_docstrings.py
          tests/test_program_ad_selection_registry.py
          tests/test_program_ad_shape_transforms.py
          tests/test_program_ad_signal_primitives.py
          tests/test_program_ad_signal_primitives_edges.py
          tests/test_program_ad_split_assembly.py
          tests/test_program_ad_stack_block_assembly.py
          tests/test_program_ad_static_array_assembly.py
          tests/test_program_ad_stencil_primitives_docstrings.py
          tests/test_program_ad_structural_finite_difference_gradient_check.py
          tests/test_program_ad_trapezoid.py
          tests/test_program_ad_triangular_diagonal_assembly.py
          tests/test_program_ad_unary_ufuncs.py
          tests/test_program_adjoint_replay.py
          tests/test_whole_program_ad_contracts.py
          tests/test_whole_program_ad_finite_difference_gradient_check.py
          tests/test_whole_program_ad_numpy_structural.py
          tests/test_whole_program_ad_runtime.py
          tests/test_whole_program_frontend.py
          tests/test_whole_program_frontend_contracts.py
          tests/test_whole_program_trace_metadata.py
          tests/test_whole_program_trace_predicates.py
          tests/test_whole_program_trace_runtime.py
          tests/test_whole_program_trace_value_linalg.py
          tests/test_whole_program_trace_value_operators.py
          tests/test_whole_program_trace_value_selection.py
          tests/test_whole_program_trace_value_shapes.py
          tests/test_whole_program_trace_value_signal.py
          tests/test_whole_program_trace_values.py
      - name: Enforce whole-program trace-value exact coverage
        run: >-
          python -m coverage report
          --rcfile=/dev/null
          --data-file=.coverage.whole-program-trace-values
          --precision=2 --show-missing
          --fail-under=100
          --include=*/whole_program_trace_values.py,*/whole_program_trace_predicates.py,*/program_ad_linalg_primitives.py,*/program_ad_product_primitives.py,*/program_ad_reduction_primitives.py,*/program_ad_cumulative_primitives.py,*/program_ad_effect_ir.py,*/program_ad_selection_primitives.py,*/program_ad_signal_primitives.py
      - name: Enforce Program-AD alias-contract exact coverage
        run: >-
          python -m coverage report
          --rcfile=/dev/null
          --data-file=.coverage.whole-program-trace-values
          --precision=2 --show-missing
          --fail-under=100
          --include=*/program_ad_alias_contracts.py
      - name: Enforce Program-AD shape-transform exact coverage
        run: >-
          python -m coverage report
          --rcfile=/dev/null
          --data-file=.coverage.whole-program-trace-values
          --precision=2 --show-missing
          --fail-under=100
          --include=*/program_ad_shape_transforms.py
