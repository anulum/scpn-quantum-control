# SCPN Quantum Control — Publish
name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-publish.txt
      - run: python -m build
      - name: Audit built wheel contents
        run: >-
          python tools/check_wheel_contents.py
          --project pyproject.toml
          'dist/*.whl'
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          attestations: true
      # Sign the sdist + wheels with Sigstore (Fulcio + Rekor,
      # OIDC-based keyless signing). `.sigstore` bundle files land
      # next to each artefact in `dist/`. PyPI respects
      # `attestations: true` and attaches the bundle server-side for
      # trusted-publisher flows.
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
