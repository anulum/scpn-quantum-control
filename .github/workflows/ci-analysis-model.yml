# SCPN Quantum Control — CI Analysis Model
name: CI / Analysis Model

on:
  workflow_call:

permissions:
  contents: read

jobs:
  koopman-quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
      - name: Type-check Koopman quality cohort
        run: >-
          python -m mypy --strict --explicit-package-bases
          src/scpn_quantum_control/analysis/koopman.py
          tools/koopman_quality_gates.py
          tests/test_koopman_quality_gate.py
      - name: Ruff NumPy docstrings for Koopman owning cohort
        run: >-
          python -m ruff check --isolated --preview --select D,D413,D417
          --config 'lint.explicit-preview-rules = true'
          --config 'lint.pydocstyle.convention = "numpy"'
          src/scpn_quantum_control/analysis/koopman.py
          tests/test_koopman.py
          tests/test_koopman_rust_generator_branches.py
          tools/koopman_quality_gates.py
          tests/test_koopman_quality_gate.py
      - name: Run Koopman connected focused coverage
        run: >-
          python -m coverage run
          --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-koopman-quality.coverage
          --branch
          -m pytest -q
          tests/test_koopman.py
          tests/test_koopman_rust_generator_branches.py
          tests/test_rust_path_benchmarks.py
      - name: Enforce Koopman exact coverage
        run: >-
          python -m coverage report
          --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-koopman-quality.coverage
          --precision=2 --show-missing
          --fail-under=100
          --include=*/analysis/koopman.py
