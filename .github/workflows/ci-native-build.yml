# SCPN Quantum Control — CI Native Build
name: CI / Native Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-wheels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the current Rust engine wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          args: >-
            --release --features extension-module --out dist
            -m scpn_quantum_engine/Cargo.toml
      - name: Upload the ABI-matched Rust engine wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scpn-quantum-engine-${{ matrix.python-version }}
          path: dist/scpn_quantum_engine-*.whl
          if-no-files-found: error
          retention-days: 1
