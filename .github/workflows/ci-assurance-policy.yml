# SCPN Quantum Control — CI Assurance Policy
name: CI / Assurance Policy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  advanced-witnesses-quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: {python-version: "3.12", cache: 'pip'}
      - run: python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
      - run: >-
          python -m mypy --strict --explicit-package-bases
          src/scpn_quantum_control/advanced_witnesses_product.py
          src/scpn_quantum_control/analysis/otoc.py
          src/scpn_quantum_control/analysis/shadow_tomography.py
          tests/test_advanced_witnesses_product.py
          tests/test_otoc.py
          tests/test_shadow_tomography.py
          tools/advanced_witnesses_quality_gates.py
          tests/test_advanced_witnesses_quality_gate.py
      - run: >-
          python -m ruff check --isolated --preview --select D,D413,D417
          --config 'lint.explicit-preview-rules = true'
          --config 'lint.pydocstyle.convention = "numpy"'
          src/scpn_quantum_control/advanced_witnesses_product.py
          src/scpn_quantum_control/analysis/otoc.py
          src/scpn_quantum_control/analysis/shadow_tomography.py
          tests/test_advanced_witnesses_product.py
          tests/test_otoc.py
          tests/test_shadow_tomography.py
          tools/advanced_witnesses_quality_gates.py
          tests/test_advanced_witnesses_quality_gate.py
      - run: >-
          python -m coverage run --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-advanced-witnesses-quality.coverage --branch
          -m pytest -q tests/test_advanced_witnesses_product.py tests/test_otoc.py
          tests/test_shadow_tomography.py
      - run: >-
          python -m coverage report --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-advanced-witnesses-quality.coverage
          --precision=2 --show-missing --fail-under=100
          --include=*/advanced_witnesses_product.py,*/analysis/otoc.py,*/analysis/shadow_tomography.py
