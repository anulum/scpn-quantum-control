          python -m coverage report
          --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-program-ad-adjoint-quality.coverage
          --precision=2 --show-missing
          --fail-under=100
          --include=*/program_ad_adjoint.py,*/program_ad_adjoint_generation.py
