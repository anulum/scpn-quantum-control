# SCPN Quantum Control — CI Compiler Cosimulation
name: CI / Compiler Cosimulation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  qpu-compute-types-quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
      - name: Type-check QPU compute-type quality cohort
        run: >-
          python -m mypy --strict --explicit-package-bases
          src/scpn_quantum_control/qpu_compute_types.py
          src/scpn_quantum_control/bridge/qpu_data_artifact.py
          tests/test_qpu_data_artifact.py
          tests/test_qpu_data_artifact_branches.py
          tools/qpu_compute_types_quality_gates.py
          tests/test_qpu_compute_types_quality_gate.py
      - name: Ruff NumPy docstrings for QPU compute-type quality cohort
        run: >-
          python -m ruff check --isolated --select D,D413
          --config 'lint.pydocstyle.convention = "numpy"'
          src/scpn_quantum_control/qpu_compute_types.py
          src/scpn_quantum_control/bridge/qpu_data_artifact.py
          tests/test_qpu_compute.py
          tests/test_qpu_compute_runtime_branches.py
          tests/test_qpu_compute_types_guards.py
          tests/test_qpu_compute_product.py
          tests/test_qpu_data_artifact.py
          tests/test_qpu_data_artifact_branches.py
          tools/qpu_compute_types_quality_gates.py
          tests/test_qpu_compute_types_quality_gate.py
      - name: Run QPU compute-type focused coverage
        run: >-
          python -m coverage run
          --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-qpu-compute-types-quality.coverage
          --branch
          -m pytest -q
          tests/test_qpu_compute.py
          tests/test_qpu_compute_runtime_branches.py
          tests/test_qpu_compute_types_guards.py
          tests/test_qpu_compute_product.py
          tests/test_qpu_data_artifact.py
          tests/test_qpu_data_artifact_branches.py
      - name: Enforce QPU compute-type exact coverage
        run: >-
          python -m coverage report
          --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-qpu-compute-types-quality.coverage
          --precision=2 --show-missing
          --fail-under=100
          --include=*/qpu_compute_types.py,*/bridge/qpu_data_artifact.py
  cosimulation-quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
