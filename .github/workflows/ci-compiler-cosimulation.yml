          python-version: "3.12"
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
      - name: Build native Program AD replay wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          args: --release --locked --features extension-module --out dist -m scpn_quantum_engine/Cargo.toml
      - name: Install native Program AD replay wheel
        run: python -m pip install --force-reinstall --no-deps dist/scpn_quantum_engine-*.whl
      - name: Type-check Program AD adjoint quality cohort
        run: >-
          python -m mypy --strict --explicit-package-bases
          src/scpn_quantum_control/program_ad_adjoint.py
          src/scpn_quantum_control/program_ad_adjoint_generation.py
          tests/test_program_ad_adjoint.py
