          src/scpn_quantum_control/cosimulation/quantum_classical.py
          tests/test_knm_partition_branches.py
          tools/cosimulation_quality_gates.py
          tests/test_cosimulation_quality_gate.py
      - name: Ruff NumPy docstrings for quantum/classical cosimulation quality cohort
        run: >-
          python -m ruff check --isolated --select D,D413
          --config 'lint.pydocstyle.convention = "numpy"'
          src/scpn_quantum_control/cosimulation/knm_partition.py
          src/scpn_quantum_control/cosimulation/quantum_classical.py
          tests/test_cosimulation.py
          tests/test_knm_partition_branches.py
          tools/cosimulation_quality_gates.py
          tests/test_cosimulation_quality_gate.py
      - name: Run quantum/classical cosimulation focused coverage
        run: >-
          python -m coverage run --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-cosimulation-quality.coverage --branch
          -m pytest -q tests/test_cosimulation.py
          tests/test_knm_partition_branches.py
      - name: Enforce quantum/classical cosimulation exact coverage
        run: >-
          python -m coverage report --rcfile=/dev/null
          --data-file=/tmp/scpn-qc-cosimulation-quality.coverage
          --precision=2 --show-missing --fail-under=100
          --include=*/cosimulation/knm_partition.py,*/cosimulation/quantum_classical.py
