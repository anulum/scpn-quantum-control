            --output "$RUNNER_TEMP/studio-workspace-journey.json"
          "${browser_coverage_command[@]}" tools/studio_browser_journey.py --scenario workbench_navigation \
            --base-url http://127.0.0.1:4173/ --workspace-source-url http://127.0.0.1:4174/ \
            --output "$RUNNER_TEMP/studio-workbench-journey.json"
          "${browser_coverage_command[@]}" tools/studio_browser_journey.py --scenario parameter_graph_editor \
            --base-url http://127.0.0.1:4173/ --workspace-source-url http://127.0.0.1:4174/ \
            --output "$RUNNER_TEMP/studio-parameter-journey.json"
          python -m coverage run --rcfile=/dev/null --branch --concurrency=greenlet \
            --data-file="$RUNNER_TEMP/studio-program-browser.coverage" \
            --include="*/tools/studio_program_authoring_browser.py" \
            tools/studio_browser_journey.py --scenario program_authoring \
            --base-url http://127.0.0.1:4173/ --output "$RUNNER_TEMP/studio-program-journey.json"
          STUDIO_PREVIEW_DIR="$RUNNER_TEMP/studio-browser-preview" \
            python -m coverage run --rcfile=/dev/null --append --branch --concurrency=greenlet \
            --data-file="$RUNNER_TEMP/studio-program-browser.coverage" \
            --include="*/tools/studio_program_authoring_browser.py" \
            -m pytest --noconftest -q tools/tests/test_studio_program_authoring_browser.py
          python -m coverage report --rcfile=/dev/null \
            --data-file="$RUNNER_TEMP/studio-program-browser.coverage" --precision=2 --show-missing --fail-under=100
      - name: Exercise original panel refusal over isolated damaged input files
        working-directory: .
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src
        run: |
          python - <<'PY_SOURCE'
          import hashlib
          import os
          import shutil
          from pathlib import Path

          original = Path.cwd().resolve()
          isolated = Path(os.environ["RUNNER_TEMP"]) / "studio-panel-refusal-source"
          isolated.mkdir()
          damaged = {
              "docs/_generated/studio_manifest.json",
              "data/studio/xy_compile_recompute_unit_20260708.json",
              "data/studio/kuramoto_scenario_meanfield_20260708.json",
              "data/studio/program_ad_replay_rational_20260714.json",
              "data/differentiable_phase_qnode/differentiable_transform_support_matrix_20260708.json",
              "data/differentiable_phase_qnode/gradient_plan_explanations_20260709.json",
              "data/differentiable_phase_qnode/differentiable_baseline_scorecard_20260620.json",
          }
          before = {name: hashlib.sha256((original / name).read_bytes()).hexdigest() for name in damaged}
          def copy_inputs(parent):
              destination = isolated / parent.relative_to(original)
              destination.mkdir(exist_ok=True)
              for child in parent.iterdir():
                  relative = child.relative_to(original).as_posix()
                  target = destination / child.name
                  if relative in damaged:
                      shutil.copy2(child, target)
                      assert target.resolve().is_relative_to(isolated)
                      target.write_text("{}\n", encoding="utf-8")
                  elif any(name.startswith(relative + "/") for name in damaged):
                      copy_inputs(child)
                  else:
                      target.symlink_to(child, target_is_directory=child.is_dir())
          copy_inputs(original / "docs")
          copy_inputs(original / "data")
          web = isolated / "studio-web"
          web.mkdir()
          for name in ("src", "browser-tests"):
              shutil.copytree(original / "studio-web" / name, web / name)
          for source in (original / "studio-web").iterdir():
              if source.is_file() and source.suffix in {".ts", ".json"}:
                  shutil.copy2(source, web / source.name)
          (web / "node_modules").symlink_to(original / "studio-web/node_modules", target_is_directory=True)
          assert before == {name: hashlib.sha256((original / name).read_bytes()).hexdigest() for name in damaged}
          for source in (original / "studio-web/src").rglob("*"):
              if source.is_file():
                  assert source.read_bytes() == (web / source.relative_to(original / "studio-web")).read_bytes()
          PY_SOURCE
          node studio-web/node_modules/vite/bin/vite.js "$RUNNER_TEMP/studio-panel-refusal-source/studio-web" \
            --host 127.0.0.1 --port 4175 --strictPort > "$RUNNER_TEMP/studio-panel-refusal-source.log" 2>&1 &
          refusal_pid=$!
          trap 'kill "$refusal_pid" 2>/dev/null || true; wait "$refusal_pid" || true' EXIT
          for ((attempt = 1; attempt <= 5; attempt++)); do
            if curl --fail --silent http://127.0.0.1:4175/browser-tests/workspace.html > /dev/null; then break; fi
            sleep 1
          done
          python -m coverage run --rcfile=/dev/null --append --branch --concurrency=greenlet \
            --data-file="$RUNNER_TEMP/studio-workspace-browser.coverage" \
            --include="*/tools/studio_browser_journey.py,*/tools/studio_parameter_browser_journey.py,*/tools/studio_workbench_browser_journey.py,*/tools/studio_workspace_browser_journey.py,*/tools/studio_workspace_browser_coverage.py,*/tools/studio_workspace_browser_ui.py" \
            tools/studio_browser_journey.py --scenario workspace_panel_refusal \
            --base-url http://127.0.0.1:4175/ --output "$RUNNER_TEMP/studio-panel-refusal-journey.json"
