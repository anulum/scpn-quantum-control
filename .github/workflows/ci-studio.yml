  studio-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: {python-version: "3.12"}
      - name: Install the locked workspace and native producer dependencies
        working-directory: .
        run: |
          python -m pip install --require-hashes -r requirements-ci-py312-linux.txt
          python -m pip install --no-deps -e .
      - name: Install locked browser acceptance dependencies
        working-directory: .
        run: |
          python -m pip install --require-hashes -r requirements-ci-studio-browser.txt
          python -m playwright install --with-deps chromium
          python -m mypy --strict --explicit-package-bases tools/studio_browser_journey.py tools/studio_parameter_browser_journey.py tools/studio_workbench_browser_journey.py tools/studio_resource_browser_journey.py tools/studio_workspace_browser_journey.py tools/studio_workspace_browser_coverage.py tools/studio_workspace_browser_ui.py tests/test_studio_browser_journey.py tests/test_studio_resource_browser_journey.py tests/test_studio_workspace_browser_journey.py tools/tests/test_studio_workspace_browser_coverage.py tools/tests/test_studio_browser_runtime_refusal.py tools/tests/test_studio_workbench_browser_journey.py tools/tests/test_studio_parameter_browser_journey.py
          python -m coverage run --rcfile=/dev/null --branch --concurrency=greenlet \
            --data-file="$RUNNER_TEMP/studio-workspace-browser.coverage" \
            --include="*/tools/studio_browser_journey.py,*/tools/studio_parameter_browser_journey.py,*/tools/studio_workbench_browser_journey.py,*/tools/studio_workspace_browser_journey.py,*/tools/studio_workspace_browser_coverage.py,*/tools/studio_workspace_browser_ui.py" \
            -m pytest --noconftest -q tests/test_studio_browser_journey.py tests/test_studio_resource_browser_journey.py tests/test_studio_workspace_browser_journey.py
          python -m ruff check tools/studio_browser_journey.py tools/studio_parameter_browser_journey.py tools/studio_workbench_browser_journey.py tools/studio_resource_browser_journey.py tools/studio_workspace_browser_journey.py tools/studio_workspace_browser_coverage.py tools/studio_workspace_browser_ui.py tools/tests/test_studio_workspace_browser_coverage.py tools/tests/test_studio_browser_runtime_refusal.py tools/tests/test_studio_workbench_browser_journey.py tools/tests/test_studio_parameter_browser_journey.py
          python -m ruff check --isolated --preview --select D,D413,D417,D420 --config 'lint.explicit-preview-rules = true' --config 'lint.pydocstyle.convention = "numpy"' tools/studio_browser_journey.py tools/studio_parameter_browser_journey.py tools/studio_workbench_browser_journey.py tools/studio_resource_browser_journey.py tools/studio_workspace_browser_journey.py tools/studio_workspace_browser_coverage.py tools/studio_workspace_browser_ui.py
      - name: Check workspace Python types and native API documentation
        working-directory: .
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src
        run: |
          python -m mypy --strict --explicit-package-bases \
            src/scpn_quantum_control/studio_workspace src/scpn_quantum_control/studio/workspace.py \
            tests/test_studio_workspace.py tests/test_studio_workspace_canonical.py \
            tests/test_studio_workspace_json_transport.py tests/test_studio_workspace_contracts.py \
            tests/test_studio_workspace_graph.py tests/test_resolved_workspace_settings.py \
            tests/test_workspace_settings_portability.py tests/test_studio_workspace_lazy.py
          python -m ruff check --isolated --preview --select D,D413,D417,D420 \
            --config 'lint.explicit-preview-rules = true' --config 'lint.pydocstyle.convention = "numpy"' \
            src/scpn_quantum_control/studio_workspace src/scpn_quantum_control/studio/workspace.py \
            tests/test_studio_workspace.py tests/test_studio_workspace_canonical.py \
            tests/test_studio_workspace_json_transport.py tests/test_studio_workspace_contracts.py \
            tests/test_studio_workspace_graph.py tests/test_resolved_workspace_settings.py \
            tests/test_workspace_settings_portability.py tests/test_studio_workspace_lazy.py
      - name: Enforce workspace Python owner coverage
        working-directory: .
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src
        run: |
          python -m coverage run --rcfile=/dev/null --branch \
            --data-file="$RUNNER_TEMP/studio-workspace.coverage" \
            --source=src/scpn_quantum_control \
            -m pytest -q tests/test_studio_workspace.py tests/test_studio_workspace_canonical.py \
            tests/test_studio_workspace_json_transport.py tests/test_studio_workspace_contracts.py \
            tests/test_studio_workspace_graph.py tests/test_studio_lazy_import.py \
            tests/test_resolved_workspace_settings.py tests/test_workspace_settings_portability.py \
            tests/test_studio_workspace_lazy.py
          python -m coverage report --rcfile=/dev/null \
            --data-file="$RUNNER_TEMP/studio-workspace.coverage" \
            --include="*/scpn_quantum_control/studio_workspace/*.py,*/scpn_quantum_control/studio/workspace.py" \
            --precision=2 --show-missing --fail-under=100
      - name: Enforce supported program native types, docs and exact coverage
        working-directory: .
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src:${{ github.workspace }}
        run: |
          python -m pip install --no-deps --require-hashes -r requirements-ci-studio-platform.txt
          python - <<'PY_PROGRAM'
          import subprocess
          import sys
          from tools.studio_executive_product_quality_gates import build_program_authoring_quality_gates
          for name, command in build_program_authoring_quality_gates(sys.executable):
              print(name, flush=True)
              subprocess.run(command, check=True)
          PY_PROGRAM
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck (TS strict)
        run: |
          pnpm typecheck
          pnpm exec tsc --project tsconfig.workspace-browser.json
      - name: Validate native workspace and coverage API documentation
        run: >-
          pnpm exec typedoc --tsconfig tsconfig.workspace-browser.json
          --entryPointStrategy expand --entryPoints src quality
          --exclude '**/*.test.ts' --exclude '**/*.test.tsx'
          --out "${{ runner.temp }}/studio-native-api" --treatWarningsAsErrors
      - name: Add the WASM build target
        run: rustup target add wasm32-unknown-unknown
      - name: Build the WASM kernel (browser recompute path needs it at test time)
        working-directory: scpn_quantum_engine/studio_wasm_kernel
        run: cargo build --release --locked --target wasm32-unknown-unknown
      - name: Assert the program-AD replay crate stays WASM-portable
        working-directory: scpn_quantum_engine/program_ad_replay
        run: cargo build --release --locked --target wasm32-unknown-unknown
      - name: Test the supported program source and original host ABI
        working-directory: scpn_quantum_engine/studio_wasm_kernel
        run: cargo test --locked --test program_source
      - name: Build the program-AD WASM kernel
        working-directory: scpn_quantum_engine/studio_program_ad_wasm
        run: cargo build --release --locked --target wasm32-unknown-unknown
      - name: Test the program-AD WASM kernel
        working-directory: scpn_quantum_engine/studio_program_ad_wasm
        run: cargo test --locked
      - name: Build the portal and the federation remote
        run: pnpm build
      - name: Build the independent federation consumer
        run: >-
          pnpm exec vite build --config browser-tests/federation.vite.ts
          --outDir "$RUNNER_TEMP/studio-federation-host"
      - name: Assert the ESM remote entry carries the locked federation name
        run: |
          test -f dist/remoteEntry.js
          grep -q "scpn_quantum_control" dist/remoteEntry.js
      - name: Ship the WASM kernel into the bundle + write the deploy manifest
        working-directory: .
        run: python3 tools/build_studio_wasm_bundle.py
      - name: Assert the deploy manifest content-addresses the shipped bundle
        working-directory: .
        run: |
          test -f studio-web/dist/deploy-manifest.json
          test -f studio-web/dist/wasm/scpn_quantum_studio_wasm_kernel.wasm
          test -f studio-web/dist/wasm/scpn_quantum_studio_program_ad_wasm.wasm
          python3 - <<'EOF'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path("studio-web/dist/deploy-manifest.json").read_text())
          for row in manifest["artifacts"]:
              path = Path("studio-web/dist") / row["path"]
              digest = "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == row["sha256"], f"digest drift: {row['path']}"
          print(f"deploy manifest verified: {len(manifest['artifacts'])} artefacts")
          EOF
      - name: Prepare the real preview and source workbench kernels
        working-directory: .
        run: |
          python - <<'PY_SOURCE'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          original = Path.cwd().resolve()
          temporary = Path(os.environ["RUNNER_TEMP"])
          preview = temporary / "studio-browser-preview"
          shutil.copytree(original / "studio-web/dist", preview)
          shutil.copytree(temporary / "studio-federation-host", preview / "acceptance-host")
          isolated = temporary / "studio-workbench-source"
          isolated.mkdir()
          for name in ("docs", "data"):
              (isolated / name).symlink_to(original / name, target_is_directory=True)
          web = isolated / "studio-web"
          web.mkdir()
          for name in ("src", "browser-tests"):
              shutil.copytree(original / "studio-web" / name, web / name)
          for source in (original / "studio-web").iterdir():
              if source.is_file() and source.suffix in {".ts", ".json"}:
                  shutil.copy2(source, web / source.name)
          (web / "node_modules").symlink_to(original / "studio-web/node_modules", target_is_directory=True)
          shutil.copytree(original / "studio-web/dist/wasm", web / "src/wasm")
          source_hashes = {}
          for source in (original / "studio-web/src").rglob("*"):
              if source.is_file():
                  relative = source.relative_to(original / "studio-web")
                  assert source.read_bytes() == (web / relative).read_bytes()
                  source_hashes[str(relative)] = hashlib.sha256(source.read_bytes()).hexdigest()
          kernels = {}
          for source in (original / "studio-web/dist/wasm").glob("*.wasm"):
              assert source.read_bytes() == (web / "src/wasm" / source.name).read_bytes()
              kernels[source.name] = hashlib.sha256(source.read_bytes()).hexdigest()
          assert set(kernels) == {"scpn_quantum_studio_wasm_kernel.wasm", "scpn_quantum_studio_program_ad_wasm.wasm"}
          (temporary / "studio-workbench-source-qualification.json").write_text(
              json.dumps({"original_source_sha256": source_hashes, "kernel_sha256": kernels}, indent=2) + "\n"
          )
          PY_SOURCE
      - name: Run the real catalogue browser journey
        working-directory: .
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/oscillatools/src
        run: |
          browser_coverage_command=(python -m coverage run --rcfile=/dev/null --append --branch --concurrency=greenlet
            --data-file="$RUNNER_TEMP/studio-workspace-browser.coverage"
            --include="*/tools/studio_browser_journey.py,*/tools/studio_parameter_browser_journey.py,*/tools/studio_workbench_browser_journey.py,*/tools/studio_workspace_browser_journey.py,*/tools/studio_workspace_browser_coverage.py,*/tools/studio_workspace_browser_ui.py")
          python -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/studio-browser-preview" > "$RUNNER_TEMP/studio-preview.log" 2>&1 &
          preview_pid=$!
          node studio-web/node_modules/vite/bin/vite.js "$RUNNER_TEMP/studio-workbench-source/studio-web" --host 127.0.0.1 --port 4174 --strictPort > "$RUNNER_TEMP/studio-workspace-source.log" 2>&1 &
          source_pid=$!
          trap 'kill "$preview_pid" "$source_pid" 2>/dev/null || true; wait "$preview_pid" || true; wait "$source_pid" || true' EXIT
          for ((attempt = 1; attempt <= 5; attempt++)); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
